# Minimal CI for the source and fixture tests.
#
# It runs the offline suite only: no vendor payload, no package build, no
# credentials, no uploaded artifacts. A green run is not evidence that a
# full Arch build succeeds; that remains a local step (see
# docs/validation.md).
name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-tests:
    name: Offline source and fixture tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install the toolchain
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install the desktop test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends librsvg2-bin desktop-file-utils xdg-utils python3

      - name: Check the shell entry points
        run: |
          for script in runtime/*.sh packaging/factory-droid-desktop packaging/factory-usage packaging/factory-callback; do
            sh -n "$script"
          done

      - name: Run the offline test suite
        run: npm test

      # Separate on purpose: benchmarks/ is excluded from the source archive,
      # so the packaged tree may not contain it and npm test must not glob it.
      # These gates encode the runtime-helper math (CPU percent factor, PSS
      # availability); a regression here broke real measurements before.
      - name: Run the benchmark unit gates
        run: node --test benchmarks/*.test.mjs
